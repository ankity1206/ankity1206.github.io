name: Generate Sitemap

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'sitemap.xml'
  workflow_dispatch:

concurrency:
  group: sitemap
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Required for git log to work properly

      - name: Generate sitemap.xml (atomic write)
        run: |
          tmpfile="sitemap-temp.xml"

          echo '<?xml version="1.0" encoding="UTF-8"?>' > $tmpfile
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> $tmpfile

          find . -name "index.html" | while read file; do
            path=$(dirname "$file")

            if [ "$path" = "." ]; then
              url="https://ankity1206.github.io/"
            else
              clean_path=$(echo "$path" | sed 's|^\./||')
              url="https://ankity1206.github.io/$clean_path/"
            fi

            lastmod=$(git log -1 --format="%cI" -- "$file")

            echo "  <url>" >> $tmpfile
            echo "    <loc>$url</loc>" >> $tmpfile
            echo "    <lastmod>$lastmod</lastmod>" >> $tmpfile
            echo "  </url>" >> $tmpfile
          done

          echo '</urlset>' >> $tmpfile

          mv $tmpfile sitemap.xml

      - name: Commit and push sitemap (only if changed)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add sitemap.xml

          if ! git diff --cached --quiet; then
            git commit -m "Auto-update sitemap [skip ci]"
            git pull --rebase origin master
            git push
          else
            echo "No changes to sitemap"
          fi