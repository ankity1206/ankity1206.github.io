<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Management Systems | Ankit Yadav</title>
  <meta name="description" content="DBMS lecture slides and notes from M.Tech Computer Science at ISI Kolkata.">

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="alternate icon" href="/favicon.ico">

  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <!-- Navigation -->
  <header class="site-header">
    <nav class="site-nav" aria-label="Main Navigation">
      <a href="/" class="nav-brand">
        <span class="brand-avatar">AY</span>
        <span>Ankit Yadav</span>
      </a>

      <div class="nav-actions">
        <a href="/notes/Mtech/second-sem/" class="btn-resume">
          <span>&larr; 2nd Sem Courses</span>
        </a>
      </div>
    </nav>
  </header>

  <!-- Content -->
  <main class="site-wrapper" style="padding-top: 120px; min-height: 70vh;">
    <div class="section-header">
      <span class="section-tag">Course Materials</span>
      <h1 class="section-title">Database Management Systems</h1>
      <p class="section-description">Lecture presentations, notes, and study slides for DBMS.</p>
    </div>

    <!-- Lectures List -->
    <div class="card-list" id="dbms-table-body">
      <p style="color: var(--text-muted);">Loading lectures...</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="site-wrapper footer-content">
      <div class="footer-left">
        <p>&copy; 2026 Ankit Yadav. DBMS Lecture Notes.</p>
      </div>
      <div class="footer-links">
        <a href="/" class="footer-link">Portfolio</a>
        <a href="/notes/" class="footer-link">Notes</a>
        <a href="https://github.com/ankity1206" target="_blank" rel="noopener noreferrer" class="footer-link">GitHub</a>
      </div>
    </div>
  </footer>

  <!-- JSON Loader -->
  <script>
  async function loadDBMSLectures() {
    const container = document.getElementById("dbms-table-body");

    try {
      const res = await fetch("dbms.json");
      const data = await res.json();

      let html = "";

      data.forEach(item => {
        const encodedUrl = encodeURIComponent(item.raw);
        const viewLink = item.raw.endsWith(".pdf")
          ? `https://docs.google.com/viewer?url=${encodedUrl}`
          : `https://view.officeapps.live.com/op/view.aspx?src=${encodedUrl}`;

        html += `
          <div class="card-item">
            <div class="card-left">
              <span class="badge-pill topic" style="font-size: 0.75rem; margin-bottom: 4px; display: inline-block;">Lecture ${item.lecture}</span>
              <h3 style="font-size: 1.05rem; font-weight: 600; color: var(--text-primary);">${item.topic}</h3>
            </div>

            <div class="card-right">
              <a href="${viewLink}" target="_blank" rel="noopener noreferrer">View</a>
              <a href="${item.raw}" download>Download</a>
            </div>
          </div>
        `;
      });

      container.innerHTML = html || "<p style='color: var(--text-muted);'>No lectures available</p>";

    } catch (err) {
      console.error("Error loading JSON:", err);
      container.innerHTML = "<p style='color: #f87171;'>Failed to load lecture data</p>";
    }
  }

  loadDBMSLectures();
  </script>

</body>
</html>
