<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 - Page Not Found | Ankit Yadav</title>
  <meta name="description" content="The page you are looking for does not exist.">

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="alternate icon" href="/favicon.ico">

  <link rel="stylesheet" href="/css/style.css">

  <style>
    .error-wrapper {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }

    .error-code {
      font-size: clamp(5rem, 12vw, 8rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #ffffff 20%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      font-family: var(--font-mono);
    }

    .error-message {
      font-size: 1.25rem;
      color: var(--text-secondary);
      max-width: 480px;
      margin-bottom: 30px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <!-- Navigation header -->
  <header class="site-header">
    <nav class="site-nav" aria-label="Main Navigation">
      <a href="/" class="nav-brand">
        <span class="brand-avatar">AY</span>
        <span>Ankit Yadav</span>
      </a>

      <div class="nav-actions">
        <a href="/" class="btn-resume">
          <span>&larr; Back to Home</span>
        </a>
      </div>
    </nav>
  </header>

  <main class="site-wrapper error-wrapper">
    <div class="error-code">404</div>
    <h1 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 12px; color: var(--text-primary);">Page Not Found</h1>
    <p class="error-message">The page you were looking for doesn't exist or has been moved to the new single-page layout.</p>
    <a href="/" class="btn-primary">
      <span>Return to Homepage</span>
    </a>
  </main>

  <footer class="site-footer">
    <div class="site-wrapper footer-content">
      <div class="footer-left">
        <p>&copy; 2026 Ankit Yadav. All rights reserved.</p>
      </div>
      <div class="footer-links">
        <a href="/" class="footer-link">Home</a>
        <a href="/data/Resume.pdf" target="_blank" rel="noopener noreferrer" class="footer-link">Resume</a>
        <a href="https://github.com/ankity1206" target="_blank" rel="noopener noreferrer" class="footer-link">GitHub</a>
      </div>
    </div>
  </footer>

</body>
</html>
